<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invalid Link</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0c1317; color: #e9edef; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #111b21; border-radius: 16px; padding: 36px 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid #3b3a28; }
    .icon { width: 64px; height: 64px; background: #fbbc04; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #202124; font-size: 32px; font-weight: bold; }
    h1 { font-size: 22px; margin-bottom: 12px; color: #fdd663; }
    p { font-size: 14px; color: #8696a0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>Invalid Link</h1>
    <p>The invite token was not found or has been revoked by the administrator.</p>
  </div>
</body>
</html>
