<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2;url={{ group_url }}">
  <title>Join ACM WhatsApp Group</title>
  <meta property="og:title" content="Join Official ACM WhatsApp Group">
  <meta property="og:description" content="Click here to join the official ACM Student Chapter WhatsApp Group.">
  <meta property="og:type" content="website">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0c1317; color: #e9edef; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .card {
      background: #111b21;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      border: 1px solid #222e35;
    }

    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 0 24px rgba(37, 211, 102, 0.4);
    }
    
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a3c2c;
      color: #25d366;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #e9edef;
      font-weight: 700;
    }

    p.subtitle {
      font-size: 14px;
      color: #8696a0;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      background-color: #25d366;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
    }
    .btn:hover {
      background-color: #1ebd56;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
    }

    .countdown {
      font-size: 13px;
      color: #8696a0;
      margin-top: 18px;
    }
    .countdown span {
      color: #25d366;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>

    <div class="badge">&#10003; One-Time Invite Verified</div>
    <h1>Joining WhatsApp Group</h1>
    <p class="subtitle">Your one-time invitation has been validated. You are being redirected to the WhatsApp group now.</p>

    <!-- Universal Direct Button -->
    <a id="joinBtn" href="{{ group_url }}" class="btn">
      <span>🚀</span> Click Here to Join WhatsApp
    </a>

    <div class="countdown">
      Redirecting automatically in <span id="timer">2</span> seconds...
    </div>
  </div>

  <script>
    const groupUrl = "{{ group_url }}";
    
    // Immediate redirect attempt
    setTimeout(function() {
      try {
        window.location.replace(groupUrl);
      } catch(e) {
        window.location.href = groupUrl;
      }
    }, 1200);

    // Countdown and automatic redirect
    let timeLeft = 2;
    const interval = setInterval(function() {
      timeLeft--;
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = timeLeft;
      
      if (timeLeft <= 0) {
        clearInterval(interval);
        try {
          window.location.replace(groupUrl);
        } catch(e) {
          window.location.href = groupUrl;
        }
      }
    }, 1000);
  </script>
</body>
</html>
