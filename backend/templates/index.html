<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Invitation Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0c1317; color: #e9edef; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #111b21; border-radius: 16px; padding: 36px 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid #222e35; }
    .icon { width: 64px; height: 64px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 30px; }
    h1 { font-size: 22px; margin-bottom: 12px; color: #e9edef; }
    p { font-size: 14px; color: #8696a0; line-height: 1.5; margin-bottom: 20px; }
    .info-box { background: #182229; border-radius: 8px; padding: 14px; font-size: 13px; color: #8696a0; text-align: left; margin-bottom: 24px; }
    .admin-link { font-size: 12px; color: #53bdeb; text-decoration: none; opacity: 0.8; }
    .admin-link:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128274;</div>
    <h1>Private Invitation Portal</h1>
    <p>This private group requires a valid, one-time individual invite link.</p>
    <div class="info-box">
      If you were invited to this group, please use the <strong>exact personal link</strong> sent to you via email or message.
    </div>
    <a href="/admin" class="admin-link">&#9881; Admin Login</a>
  </div>
</body>
</html>
